name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean --noconfirm "足球胜负彩分析工具.spec"
      - run: pyinstaller --clean --noconfirm "足球更新器.spec"
      - run: choco install innosetup --no-progress -y
      - run: iscc /DAppVersion=${{ github.ref_name }} "football_analysis.iss"
      - run: python tools/make_release.py
        env:
          VERSION: ${{ github.ref_name }}
      - run: python tools/create_latest_manifest.py
        env:
          VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/football_analysis.exe
            dist/updater.exe
            dist/football_analysis_full.zip
            dist/football_analysis_setup.exe
            dist/latest.json
          generate_release_notes: true
